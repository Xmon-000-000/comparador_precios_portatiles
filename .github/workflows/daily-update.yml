name: Daily price update

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update JSON snapshots
        env:
          PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
          PRICE_FEED_PATH: ${{ secrets.PRICE_FEED_PATH }}
        run: |
          python scripts/update_prices.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data; then
            echo "No data changes to commit"
            exit 0
          fi

          git add data/catalogo.json data/precios.json data/historico.json
          git commit -m "Update daily price snapshots"
          git push origin HEAD:${GITHUB_REF_NAME}
